# Analysis options for Flutter project with professional linting rules.
# These rules enforce code quality, consistency, and best practices.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat missing returns as errors (prevents runtime crashes)
    missing_return: error
    # Treat unused imports as warnings (keeps code clean)
    unused_import: warning
  exclude:
    # Don't analyze generated files
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"

linter:
  rules:
    # ── Style rules ──
    # Forces you to use 'final' for variables that are never reassigned.
    # Example: final name = 'Juan'; instead of var name = 'Juan';
    prefer_final_locals: true

    # Forces single quotes for strings: 'hello' instead of "hello"
    prefer_single_quotes: true

    # Warns if you leave print() statements in the code (use debugPrint instead)
    avoid_print: true

    # Requires const constructors where possible (improves performance)
    prefer_const_constructors: true
    prefer_const_declarations: true

    # ── Safety rules ──
    # Warns about unused variables, parameters, and imports
    # (keeps the codebase clean)
    unnecessary_this: true
    unnecessary_new: true
    unnecessary_const: true

    # Requires explicit types in public APIs for better documentation
    always_declare_return_types: true

    # Avoids empty catch blocks that silently swallow errors
    empty_catches: true

    # ── Formatting rules ──
    # Enforces consistent ordering of directives
    directives_ordering: true

    # Requires trailing commas for better git diffs
    require_trailing_commas: true
