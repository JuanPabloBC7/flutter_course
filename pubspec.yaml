name: flutter_course
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  font_awesome_flutter: 11.0.0
  url_launcher: 6.3.2
  scrollable_positioned_list: 0.3.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.5
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "app_icon.jpg"

flutter:
  generate: true
  uses-material-design: true

  assets:
   - lib/core/assets/img/pro-background.png
   - lib/core/assets/img/onboard-background.png
   - lib/core/assets/img/logo-android.png
   - lib/core/assets/img/logo-ios.png
   - lib/core/assets/img/logo-argon.png
   - lib/core/assets/img/profile-screen-avatar.jpg
   - lib/core/assets/img/profile-screen-bg.png
   - lib/core/assets/img/register-bg.png
   - lib/core/assets/img/chat-avatar.jpeg
   - lib/core/assets/img/argon-logo.png
   - lib/core/assets/img/argon-logo-onboarding.png

  fonts:
    - family: OpenSans
      fonts:
        - asset: lib/core/assets/fonts/OpenSans-Regular.ttf
        - asset: lib/core/assets/fonts/OpenSans-Light.ttf
          weight: 200
        - asset: lib/core/assets/fonts/OpenSans-Bold.ttf
          weight: 600
